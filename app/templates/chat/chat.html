{% extends "base.html" %}

{% block content %}

<div class="chat-layout">

    <!-- ========================= -->
    <!-- LEFT: CONVERSATIONS       -->
    <!-- ========================= -->

    <aside class="conversation-sidebar">

        <div class="sidebar-header">

            <h2>Conversations</h2>

            <button
                id="new-chat-button"
                type="button"
            >
                + New Chat
            </button>

        </div>

        <div
            id="conversation-list"
            class="conversation-list"
        >
            <p class="empty-state">
                No conversations yet.
            </p>
        </div>
        <div class="documents-section">
            <div class="documents-header">
                <h2>My Documents</h2>
                <button
                    id="upload-button"
                    type="button"
                >
                    + Upload
                </button>
            </div>

            <input
                id="file-input"
                type="file"
                hidden
                accept=".pdf,.doc,.docx,.txt,.csv"
            >

            <div
                id="document-list"
                class="document-list"
            >
                <p class="empty-state">
                    No documents yet.
                </p>
            </div>
        </div>
    </aside>


    <!-- ========================= -->
    <!-- CENTER: CHAT               -->
    <!-- ========================= -->

    <main class="chat-main">

        <div
            id="chat-messages"
            class="chat-messages"
        >

            <div
                id="chat-empty"
                class="chat-empty"
            >
                <h1>Document Assistant</h1>

                <p>
                    Ask questions about your
                    uploaded documents.
                </p>
            </div>

        </div>


        <!-- ========================= -->
        <!-- INPUT                     -->
        <!-- ========================= -->

        <div class="chat-input-area">

            <textarea
                id="chat-input"
                placeholder="Ask a question..."
                rows="1"
            ></textarea>

            <button
                id="send-button"
                type="button"
            >
                Send
            </button>

        </div>

    </main>


    <!-- ========================= -->
    <!-- RIGHT: SOURCES             -->
    <!-- ========================= -->

    <aside class="source-sidebar">

        <div class="source-header">

            <h2>Sources</h2>

        </div>

        <div
            id="source-list"
            class="source-list"
        >

            <p class="empty-state">
                Sources will appear here.
            </p>

        </div>

    </aside>

</div>

{% endblock %}
