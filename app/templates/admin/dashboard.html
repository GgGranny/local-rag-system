<section class="create-user-section">

    <h2>Create User</h2>

    <form
        method="POST"
        action="{{ url_for('admin.create_user') }}"
    >

        <div>
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>


        <div>
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>


        <button type="submit">
            Create User
        </button>

    </form>
    <a href="{{ url_for('admin.documents') }}">
    Manage Documents
</a>

</section>
