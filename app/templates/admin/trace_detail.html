{% extends "admin/base.html" %}
{% block admin_content %}
<section class="admin-dashboard trace-page">
  <a class="back-link" href="{{ url_for('monitoring.dashboard') }}">← Back to monitoring</a>
  <div class="monitoring-title"><div><p class="eyebrow">RAG execution</p><h1>Trace detail</h1><p id="trace-header">Loading trace {{ trace.trace_id }}…</p></div><button id="copy-trace">Copy trace ID</button></div>
  <p id="trace-state" class="source-loading">Loading complete execution data…</p><div id="trace-content" hidden></div>
</section>
<script>
(() => {
 const id={{ trace.trace_id|tojson }}, $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const duration=v=>v===null||v===undefined?'Unavailable':v<1000?`${Math.round(v)} ms`:v<60000?`${(v/1000).toFixed(2)} s`:`${Math.floor(v/60000)} min ${Math.round((v%60000)/1000)} s`;
 const missing={disabled_by_configuration:'Content hidden by monitoring configuration.',not_collected:'This request ended before the value was collected.',missing_from_trace:'Content is missing from this trace; it may predate content capture.',not_applicable:'Not applicable to this request.',not_authorized:'You are not authorized to view this content.',unavailable:'Unavailable.'};
 const value=o=>o&&o.available?esc(o.value):`<em>${esc(missing[o?.reason]||'Unavailable.')}</em>`;
 const box=(title, html)=>`<article class="monitoring-panel trace-section"><h2>${title}</h2>${html}</article>`;
 async function load(){ try { const r=await fetch(`{{ url_for('monitoring.api_trace', trace_id='TRACE_ID') }}`.replace('TRACE_ID',encodeURIComponent(id))); if(!r.ok) throw new Error('Trace could not be loaded.'); const x=await r.json(); $('trace-header').textContent=`${x.status} · ${duration(x.total_ms)} · ${x.model_name||'Local Ollama model'}`; const chunks=x.retrieved_chunks?.available?x.retrieved_chunks.value:[]; const citations=x.citations?.available?x.citations.value:[]; const evaluation=x.evaluations?.length?JSON.stringify(x.evaluations,null,2):'No evaluation has been completed. RAGAS 0.4.3 is installed, but this local application has no instructor-compatible evaluator adapter configured.'; $('trace-content').innerHTML=box('Request',`<dl class="trace-meta"><dt>Trace ID</dt><dd>${esc(x.trace_id)}</dd><dt>Conversation</dt><dd>${esc(x.conversation_id)}</dd><dt>Message</dt><dd>${esc(x.message_id)}</dd><dt>User</dt><dd>${esc(x.user_id)} (${esc(x.user_role)})</dd><dt>Selected documents</dt><dd>${esc((x.selected_document_ids||[]).join(', ')||'All completed documents')}</dd><dt>Query type</dt><dd>${esc(x.query_type||'Unavailable')}</dd></dl>`)+box('User question',`<pre>${value(x.original_query)}</pre>`)+box('Query processing',`<dl class="trace-meta"><dt>Final retrieval query</dt><dd>${value(x.retrieval_query)}</dd><dt>Rewrite used</dt><dd>${x.rewrite_used?'Yes':'No'}</dd></dl>`)+box('Retrieval results',chunks.length?chunks.map((c,i)=>`<details><summary>#${i+1} ${esc(c.metadata?.filename||'Unknown document')} · page ${esc(c.metadata?.page_number??'—')}</summary><p>Chunk: ${esc(c.chunk_id)} · score: ${esc(c.score??'not reported')} · ${esc(c.metadata?.extraction_method||'unknown extraction')}</p><pre>${esc(c.content||'')}</pre></details>`).join(''):`<p>${value(x.retrieved_chunks)}</p>`)+box('Final context',`<pre>${value(x.context)}</pre>`)+box('Prompt',`<pre>${value(x.prompt)}</pre>`)+box('Generation',`<dl class="trace-meta"><dt>Model</dt><dd>${esc(x.model_name||'Unavailable')}</dd><dt>Input tokens</dt><dd>${esc(x.tokens.prompt.available?x.tokens.prompt.value:'Not reported by Ollama')}</dd><dt>Output tokens</dt><dd>${esc(x.tokens.completion.available?x.tokens.completion.value:'Not reported by Ollama')}</dd><dt>Estimated local cost</dt><dd>${x.estimated_cost===null?'Unavailable':`$${esc(x.estimated_cost)}`}</dd></dl><h3>Answer</h3><pre>${value(x.answer)}</pre>`)+box('Citations and sources',citations.length?citations.map(c=>`<details><summary>${esc(c.citation)} ${esc(c.filename||'Unknown document')}</summary><p>Chunk ${esc(c.chunk_id)} · page ${esc(c.page_number??'—')} · ${esc(c.extraction_method||'unknown extraction')}</p><pre>${esc(c.content||'')}</pre></details>`).join(''):`<p>${value(x.citations)}</p>`)+box('RAGAS evaluation',`<pre>${esc(evaluation)}</pre>`)+box('Stage timeline',x.stages.length?x.stages.map(s=>`<div class="timeline-row"><strong>${esc(s.label)}</strong><span>${duration(s.duration_ms)}</span><small>${esc(s.description)} · ${esc(s.internal_name)}</small></div>`).join(''):'<p>No stage timings were recorded.</p>'); $('trace-state').hidden=true; $('trace-content').hidden=false; } catch(e) { $('trace-state').textContent=e.message; } }
 $('copy-trace').addEventListener('click',()=>navigator.clipboard?.writeText(id)); load();
})();
</script>
{% endblock %}
