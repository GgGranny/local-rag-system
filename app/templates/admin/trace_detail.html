{% extends "admin/base.html" %}
{% block admin_content %}
<section class="admin-dashboard trace-page">
  <a class="back-link" href="{{ url_for('monitoring.dashboard') }}">Back to monitoring</a>
  <div class="monitoring-title"><div><p class="eyebrow">RAG execution</p><h1>Trace detail</h1><p id="trace-header">Loading trace {{ trace.trace_id }}…</p></div><div><button id="run-relevancy">Run answer-relevancy evaluation</button><button id="copy-trace">Copy trace ID</button></div></div>
  <p id="trace-state" class="source-loading">Loading complete execution data…</p><div id="trace-content" hidden></div>
</section>
<script>
(() => {
 const traceId={{ trace.trace_id|tojson }}, $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dur=v=>v==null?'Unavailable':v<1000?`${Math.round(v)} ms`:`${(v/1000).toFixed(2)} s`, missing={disabled_by_configuration:'Content hidden by monitoring configuration.',not_collected:'This request ended before the value was collected.',missing_from_trace:'Content is missing from this trace.',not_applicable:'Not applicable.'};
 const field=x=>x?.available?esc(x.value):`<em>${esc(missing[x?.reason]||'Unavailable.')}</em>`, box=(h,b)=>`<article class="monitoring-panel trace-section"><h2>${h}</h2>${b}</article>`;
 function evaluation(item){if(!item)return 'Not evaluated\n\nRun an evaluation to calculate this metric.';const state={COMPLETED:'Evaluated',PENDING:'Evaluation pending',RUNNING:'Evaluation pending',FAILED:'Evaluation failed',MISSING_INPUT:'Missing input',NOT_CONFIGURED:'Not configured'}[item.status]||item.status;return `Answer relevance\n${item.score==null?'Unavailable':item.score.toFixed(2)+' / 1.00'}\n\nMeasures how directly the generated answer addresses the original user question. It does not prove factual correctness or grounding.\n\nStatus: ${state}\nEvaluation ID: ${item.evaluation_id}\nEvaluator: ${item.model||'Unavailable'}\nRAGAS: ${item.ragas_version||'Unavailable'}\nEvaluated at: ${item.evaluated_at?new Date(item.evaluated_at).toLocaleString():'Unavailable'}\nDuration: ${dur(item.duration_ms)}\n${item.error?'Reason: '+item.error:''}`}
 async function load(){try{const r=await fetch(`{{ url_for('monitoring.api_trace', trace_id='TRACE_ID') }}`.replace('TRACE_ID',encodeURIComponent(traceId)));if(!r.ok)throw new Error('Trace could not be loaded.');const x=await r.json(), chunks=x.retrieved_chunks?.available?x.retrieved_chunks.value:[], citations=x.citations?.available?x.citations.value:[]; $('trace-header').textContent=`${x.status} · ${dur(x.total_ms)} · ${x.model_name||'Local Ollama model'}`;const chunkHtml=chunks.length?chunks.map((c,i)=>`<details><summary>#${i+1} ${esc(c.metadata?.filename||'Unknown document')}</summary><p>Chunk ${esc(c.chunk_id)} · page ${esc(c.metadata?.page_number??'—')} · score ${esc(c.score??'not reported')}</p><pre>${esc(c.content||'')}</pre></details>`).join(''):`<p>${field(x.retrieved_chunks)}</p>`, citeHtml=citations.length?citations.map(c=>`<details><summary>${esc(c.citation)} ${esc(c.filename||'Unknown document')}</summary><pre>${esc(c.content||'')}</pre></details>`).join(''):`<p>${field(x.citations)}</p>`;$('trace-content').innerHTML=box('Request',`<dl class="trace-meta"><dt>Trace ID</dt><dd>${esc(x.trace_id)}</dd><dt>Conversation</dt><dd>${esc(x.conversation_id)}</dd><dt>Message</dt><dd>${esc(x.message_id)}</dd><dt>User</dt><dd>${esc(x.user_id)} (${esc(x.user_role)})</dd><dt>Query type</dt><dd>${esc(x.query_type||'Unavailable')}</dd></dl>`)+box('User question',`<pre>${field(x.original_query)}</pre>`)+box('Query processing',`<p>Final retrieval query</p><pre>${field(x.retrieval_query)}</pre><p>Rewrite used: ${x.rewrite_used?'Yes':'No'}</p>`)+box('Retrieval results',chunkHtml)+box('Final context',`<pre>${field(x.context)}</pre>`)+box('Prompt',`<pre>${field(x.prompt)}</pre>`)+box('Generation',`<p>Model: ${esc(x.model_name||'Unavailable')}<br>Input tokens: ${esc(x.tokens.prompt.available?x.tokens.prompt.value:'Not reported')}<br>Output tokens: ${esc(x.tokens.completion.available?x.tokens.completion.value:'Not reported')}</p><pre>${field(x.answer)}</pre>`)+box('Citations and sources',citeHtml)+box('Answer relevance',`<pre>${esc(evaluation(x.evaluations?.[0]))}</pre>`)+box('Stage timeline',x.stages.map(s=>`<div class="timeline-row"><strong>${esc(s.label)}</strong><span>${dur(s.duration_ms)}</span><small>${esc(s.internal_name)}</small></div>`).join('')||'<p>No timings recorded.</p>');$('trace-state').hidden=true;$('trace-content').hidden=false}catch(e){$('trace-state').textContent=e.message}}
 async function evaluate(){const b=$('run-relevancy');b.disabled=true;b.textContent='Evaluating…';try{const r=await fetch(`{{ url_for('monitoring.run_answer_relevancy_evaluation', trace_id='TRACE_ID') }}`.replace('TRACE_ID',encodeURIComponent(traceId)),{method:'POST'}), data=await r.json();if(!r.ok)throw new Error(data.error||data.evaluation?.error||'Evaluation failed.');await load()}catch(e){$('trace-state').textContent=e.message;$('trace-state').hidden=false}finally{b.disabled=false;b.textContent='Run answer-relevancy evaluation'}}
 $('copy-trace').addEventListener('click',()=>navigator.clipboard?.writeText(traceId));$('run-relevancy').addEventListener('click',evaluate);load();
})();
</script>
{% endblock %}
