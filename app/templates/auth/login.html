{% extends "base.html" %}

{% block title %}
Login — Local RAG
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h1>Local RAG</h1>

        <p class="subtitle">
            Sign in to continue
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
